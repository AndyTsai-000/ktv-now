<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>隨時唱 KTV</title>
<meta name="theme-color" content="#120b24">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A4%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#120b24;--panel:#1d1436;--panel2:#271b47;--line:#3a2b63;--text:#f3eefe;--dim:#a99cc9;--pink:#ff4fa3;--cyan:#33e1ff;--gold:#ffd166}
*{box-sizing:border-box}
html,body,#app{margin:0;height:100%}
#app{display:flex;flex-direction:column}
header{flex:none}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;background:var(--panel2);padding:8px 14px}
button:hover{filter:brightness(1.2)}
button:disabled{opacity:.4;cursor:default;filter:none}
.main{background:linear-gradient(135deg,var(--pink),#a855f7);color:#fff;font-weight:700}
.logo{font-weight:800;font-size:20px;letter-spacing:1px;background:linear-gradient(90deg,var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
header .sp{flex:1}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#777;margin-right:6px;vertical-align:middle}
.dot.on{background:#4ade80;box-shadow:0 0 6px #4ade80}
.small{font-size:13px;color:var(--dim)}

/* 電視畫面 */
#tv{display:grid;grid-template-columns:1fr 380px;flex:1;min-height:0}
#left{display:flex;flex-direction:column;min-width:0;padding:16px;gap:12px}
#stage{position:relative;flex:1;min-height:0;background:#000;border-radius:14px;overflow:hidden}
#stage:fullscreen{border-radius:0}
#player,#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;background:radial-gradient(circle at 50% 40%,#3b1d6e,#120b24 70%)}
#idle h2{margin:0;font-size:clamp(22px,4vw,44px)}
#idleQr{background:#fff;padding:10px;border-radius:12px}
#idleQr img,#idleQr canvas{display:block;width:clamp(120px,18vw,200px)!important;height:auto!important}
#nextUp{position:absolute;top:14px;right:14px;max-width:60%;padding:8px 14px;border-radius:10px;background:rgba(18,11,36,.8);font-size:15px;display:none;pointer-events:none}
#stage:fullscreen #nextUp.has{display:block}
#exitFs{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);display:none;padding:3px 12px;border-radius:999px;font-size:12px;white-space:nowrap;background:rgba(18,11,36,.85);border:1px solid rgba(255,255,255,.35);opacity:.8}
#exitFs:hover{opacity:1}
#stage:fullscreen #exitFs{display:block}
#toast{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);padding:10px 18px;border-radius:12px;background:rgba(255,79,163,.92);color:#fff;font-size:17px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
#bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#nowT{flex:1;min-width:160px;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nowT .small{font-weight:400}
.ctl button{font-size:16px;padding:10px 16px}

#side{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--panel)}
.search{display:flex;gap:8px;padding:14px 14px 6px}
.search input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.search input:focus{border-color:var(--pink)}
.opt{padding:0 14px 8px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim)}
.opt label{display:flex;align-items:center;gap:6px}
.tabs{display:flex;gap:4px;padding:0 14px}
.tabs button{flex:1 1 auto;background:transparent;border-radius:10px 10px 0 0;padding:8px 4px;color:var(--dim);white-space:nowrap;font-size:14px}
.tabs button.on{background:var(--panel2);color:var(--text);font-weight:700}
.list{flex:1;overflow:auto;background:var(--panel2);margin:0 14px 14px;border-radius:0 0 10px 10px;padding:6px}
.it{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px}
.it:hover{background:rgba(255,255,255,.05)}
.it img{width:72px;height:40px;object-fit:cover;border-radius:6px;flex:none;background:#000}
.it .tx{flex:1;min-width:0}
.it .t{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35;word-break:break-all}
.it .s{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it button{padding:6px 10px;font-size:13px;flex:none}
.it button:not(.main),.plTools button:not(.main){background:var(--panel);border:1px solid var(--line)} /* 跟清單底色一樣時看不出是按鈕 */
.it .n{width:22px;text-align:center;color:var(--gold);font-weight:700;flex:none}
.empty{padding:20px 10px;text-align:center;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.chips button{padding:6px 12px;font-size:13px;background:var(--panel);border:1px solid var(--line)}
#qrPop{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.6)}
#qrPop[hidden]{display:none}
#qrPop .card{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:340px;padding:22px 20px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-align:center}
#qrPop .hd{font-size:18px;font-weight:700;margin-bottom:6px}
#qrPop .q{background:#fff;padding:10px;border-radius:12px}
#qrPop .q img,#qrPop .q canvas{display:block;width:min(240px,62vw)!important;height:auto!important}
#qrPop .code{font-size:32px;line-height:1.2}
#qrPop .x{position:absolute;top:8px;right:8px;padding:6px 11px}
#qrPop .link{background:transparent;color:var(--dim);font-size:13px;text-decoration:underline;margin-top:6px}
#asPhone .dot{margin-right:6px}
.code{font-size:22px;font-weight:800;letter-spacing:3px;color:var(--gold)}

/* 手機點歌 */
#remote{width:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}
#remote .now{margin:12px 16px 0;padding:12px;border-radius:12px;background:var(--panel)}
#remote .now .t{font-weight:700;font-size:16px}
#rStage{position:relative;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;margin-bottom:10px}
#rStage iframe,#rPlayer,#rShield{position:absolute;inset:0;width:100%;height:100%;border:0}
#rMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;color:#bbb;font-size:14px;background:#000}
#rMsg:empty{display:none}
#remote .now .link{background:transparent;border:0;padding:10px 8px;margin:-10px 0;color:var(--dim);font-size:13px;text-decoration:underline}
#remote .ctl{display:flex;gap:8px;margin-top:10px}
#remote .ctl button{flex:1;padding:10px 4px}
#remote .search{padding:12px 16px 6px}
#remote .opt{padding:0 16px 8px}
#remote .tabs{padding:0 16px}
#remote .list{margin:0 16px 16px}
.name{width:90px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px}

/* 特效 */
#fxBar{display:flex;gap:6px;flex-wrap:wrap}
#fxBar button,.fxGrid button{padding:6px 10px;font-size:14px;background:var(--panel);border:1px solid var(--line)}
#fxBar button.hit,.fxGrid button.hit{background:var(--pink);color:#fff}
.fxGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
#fxLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#fxLayer canvas{position:absolute;inset:0;width:100%;height:100%}
.fxBanner{position:absolute;left:50%;top:42%;font-size:clamp(34px,7vw,96px);font-weight:900;color:#fff;white-space:nowrap;pointer-events:none;
  text-shadow:0 0 14px var(--c1,#ff4fa3),0 0 36px var(--c2,#a855f7),0 5px 0 rgba(0,0,0,.6);animation:fxPop 1.7s ease-out forwards}
@keyframes fxPop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-10deg);opacity:0}14%{transform:translate(-50%,-50%) scale(1.18) rotate(3deg);opacity:1}
  28%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{opacity:1}100%{transform:translate(-50%,-62%) scale(1.04);opacity:0}}

.maybeHd{margin:10px 6px 4px;padding:6px 8px;border-top:1px dashed var(--line);font-size:12px;color:var(--gold)}

/* 推薦／最新 */
.opt .sp{flex:1}
.opt .qk{padding:4px 10px;font-size:13px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.opt .qk.on{background:var(--pink);border-color:var(--pink);color:#fff}
.chartHd{padding:8px 8px 2px;font-weight:700}
.chartHd .small{font-weight:400}
.it .n.rk{width:28px;font-size:15px}

/* 歌單 */
.plBar{display:flex;gap:6px;flex-wrap:wrap;padding:6px}
.chip{padding:5px 11px;font-size:13px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.chip .small{color:inherit;opacity:.75}
.plTools{display:flex;gap:8px;padding:2px 6px 8px;flex-wrap:wrap}
.plTools button{padding:6px 12px;font-size:13px}
.popMenu{position:fixed;z-index:50;display:flex;flex-direction:column;gap:4px;min-width:160px;max-width:80vw;padding:6px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.popMenu button{text-align:left;font-size:14px}
.popMenu .hd{font-size:12px;color:var(--dim);padding:2px 6px}

/* 電腦裡的歌 */
.ph{width:72px;height:40px;border-radius:6px;flex:none;background:linear-gradient(135deg,#3b1d6e,#1d1436);display:flex;align-items:center;justify-content:center;font-size:20px}
.localAdd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px}
#localV{position:absolute;inset:0;width:100%;height:100%;background:#000;display:none}
#localA{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px;background:radial-gradient(circle at 50% 40%,#3b1d6e,#120b24 70%)}
#localT{font-size:clamp(22px,4vw,46px);font-weight:800}
.eq{display:flex;gap:7px;align-items:flex-end;height:clamp(60px,14vw,140px)}
.eq i{width:clamp(8px,1.2vw,16px);height:20%;border-radius:8px;background:linear-gradient(var(--pink),var(--cyan));animation:eq .9s ease-in-out infinite alternate}
.eq i:nth-child(2n){animation-duration:.65s}.eq i:nth-child(3n){animation-duration:1.15s}.eq i:nth-child(5n){animation-duration:.8s;animation-delay:-.3s}
.eq.stop i{animation-play-state:paused}
@keyframes eq{from{height:12%}to{height:100%}}
#keyBox{display:none;align-items:center;gap:4px}
#keyBox span{min-width:58px;text-align:center;font-weight:700}
body.dragging #side{outline:3px dashed var(--pink);outline-offset:-6px}

/* 去人聲小視窗 */
#vr{max-width:420px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
#vr .big{font-size:20px;padding:14px}
#vr ol{margin:0;padding-left:20px;color:var(--dim);font-size:14px}
#vr .st{padding:10px 12px;border-radius:10px;background:var(--panel);font-size:14px}
#vr .meter{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
#vr .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:width .2s}
#bVr.on{background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff}

@media (max-width:1280px){ .ctl button{padding:10px 11px} }
@media (max-width:900px){
  #app{height:auto;min-height:100%}
  #tv{display:block}
  #left{padding:12px}
  #stage{flex:none;aspect-ratio:16/9}
  #side{border-left:0;border-top:1px solid var(--line);height:70vh}
}
@media (max-width:520px){
  header{padding:10px 12px;gap:8px}
  .hideS{display:none}
  header button{padding:6px 10px;font-size:13px;white-space:nowrap}
  .logo{font-size:17px}
  #idle{gap:6px}
  #idle .small{display:none}
  #idleQr img,#idleQr canvas{width:110px!important}
  .it img,.ph{width:56px;height:32px}
  .tabs button{font-size:13px}
  .search input,.name{font-size:16px} /* iPhone 輸入框小於 16px 一點下去整頁會放大 */
  #toast{font-size:14px;padding:8px 12px;bottom:10px}
  .fxGrid button{white-space:nowrap;padding:6px 2px}
}
</style>

<body>
<div id="app"></div>
<script>
'use strict';
const API='https://ktv-search.multi-share-api.workers.dev';
// 同時連兩台免費伺服器，哪台通就走哪台（2026-10-26 emqx 連不上，手機一直「還沒連上」）
const MQ_URL=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'],TOPIC='ktv-now-tw/';
const JOIN=(new URLSearchParams(location.search).get('r')||'').replace(/\D/g,'').slice(0,6);
const IS_REMOTE=JOIN.length===6;
const IS_VR=new URLSearchParams(location.search).get('vr')==='1';
const IS_MOBILE=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
const DEV=IS_MOBILE&&!IS_REMOTE?'手機':'電腦'; // 手機自己當電視時，「電腦的歌」其實是手機裡的歌
const APP_V='2026-10-23c'; // 去人聲小視窗會一直開著，網站更新後要知道它是不是舊版
const CAN_VR=!!(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia)&&!/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
// 搜尋頁的快捷鍵：[顯示的字, 實際搜尋的字或好幾組字]（外文＝英文＋韓文，用英文搜比較找得到伴唱版）
const HOT=[['周杰倫'],['五月天'],['告五人'],['蔡依林'],['田馥甄'],['張惠妹'],['林俊傑'],['伍佰'],['張學友'],['鄧紫棋'],['華語經典'],['台語經典'],['大陸歌曲'],['外文歌曲',['English pop karaoke version','Korean song karaoke instrumental']],['對唱情歌']];

const $=s=>document.querySelector(s);
const load=(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } };
const save=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const thumb=id=>'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg';
const keyOf=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ytId=s=>{ const m=String(s).match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/); return m?m[1]:null; };
const clean=v=>String(v==null?'':v).replace(/[<>&"'\\]/g,'').trim().slice(0,10);
const isLocal=it=>!!it&&String(it.id||'').startsWith('local:');
const song=o=>({id:String(o.id||'').slice(0,isLocal(o)?40:11),title:String(o.title||'YouTube 影片').slice(0,120),ch:String(o.ch||'').slice(0,60),len:String(o.len||'').slice(0,10),...(isLocal(o)?{kind:o.kind==='video'?'video':'audio'}:{})});

// 最小的 MQTT 3.1.1 用戶端（跟跨界遊戲區同一套）：只做連線、訂閱、發佈和心跳，斷線自動重連
// 好幾台一起用：每則訊息帶編號，兩台都收到時只算一次（不然點一首會變兩首）
function Mq(urls,onReady,onMsg,onState){
  const subs=new Set(),seen=[],api={up:false};
  const cs=urls.map(u=>{ const c=Mq1(u,()=>{ for(const t of subs) c.sub(t); onReady(); },o=>{
      if(o._m){ if(seen.includes(o._m)) return; seen.push(o._m); if(seen.length>300) seen.shift(); delete o._m; }
      onMsg(o); },()=>{ api.up=cs.some(x=>x.up); onState(api.up); });
    return c; });
  api.sub=t=>{ subs.add(t); for(const c of cs) if(c.up) c.sub(t); };
  api.pub=(t,o)=>{ const m=Object.assign({_m:keyOf()},o); for(const c of cs) if(c.up) c.pub(t,m); };
  api.close=()=>{ for(const c of cs) c.close(); };
  return api;
}
function Mq1(url,onReady,onMsg,onState){
  const te=new TextEncoder(),td=new TextDecoder(); let ws,buf,ping=0,pid=1,dead=false;
  const str=t=>{ const b=te.encode(t),o=new Uint8Array(b.length+2); o[0]=b.length>>8; o[1]=b.length&255; o.set(b,2); return o; };
  const join=parts=>{ let n=0; for(const a of parts) n+=a.length; const o=new Uint8Array(n); let k=0; for(const a of parts){ o.set(a,k); k+=a.length; } return o; };
  const pkt=(h,body)=>{ const len=[]; let n=body.length; do{ let d=n%128; n=Math.floor(n/128); if(n>0) d|=128; len.push(d); }while(n>0); return join([[h],len,body]); };
  const api={up:false};
  function open(){
    buf=new Uint8Array(0);
    try{ ws=new WebSocket(url,'mqtt'); }catch(e){ setTimeout(open,3000); return; }
    ws.binaryType='arraybuffer';
    ws.onopen=()=>ws.send(pkt(0x10,join([str('MQTT'),[4,2,0,60],str('ktv'+Math.random().toString(36).slice(2,12))])));
    ws.onmessage=e=>{ buf=join([buf,new Uint8Array(e.data)]);
      for(;;){ if(buf.length<2) return; let mul=1,len=0,i=1,d; do{ if(i>=buf.length) return; d=buf[i++]; len+=(d&127)*mul; mul*=128; }while(d&128);
        if(buf.length<i+len) return; const type=buf[0]>>4,body=buf.slice(i,i+len); buf=buf.slice(i+len);
        if(type===2){ api.up=true; clearInterval(ping); ping=setInterval(()=>{ if(ws.readyState===1) ws.send(new Uint8Array([0xC0,0])); },30000); onState(true); onReady(); }
        else if(type===3){ const tl=(body[0]<<8)|body[1]; let o=null; try{ o=JSON.parse(td.decode(body.subarray(2+tl))); }catch(_){} if(o) onMsg(o); } } };
    ws.onclose=()=>{ api.up=false; clearInterval(ping); onState(false); if(!dead) setTimeout(open,2500); };
    ws.onerror=()=>{ try{ws.close();}catch(e){} };
  }
  api.sub=t=>{ if(ws&&ws.readyState===1) ws.send(pkt(0x82,join([[0,(pid++%250)+1],str(t),[0]]))); };
  api.pub=(t,o)=>{ if(ws&&ws.readyState===1) ws.send(pkt(0x30,join([str(t),te.encode(JSON.stringify(o))]))); };
  api.close=()=>{ dead=true; clearInterval(ping); try{ws.close();}catch(e){} };
  open();
  return api;
}

// ---------- KTV 特效音（全部用程式合成，沒有用別人的音檔）----------
const FX=[['clap','👏','掌聲'],['cheer','🙌','歡呼'],['tada','🎺','登登登'],['popper','🎉','拉炮'],['crow','😶','烏鴉飛過']];
const FX_LEN={clap:3.2,cheer:3.4,tada:2,popper:1.8,crow:2.8};
const fxNoise=(c,sec)=>{ const b=c.createBuffer(1,Math.ceil(c.sampleRate*sec),c.sampleRate),d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; };
const rnd=(a,b)=>a+Math.random()*(b-a);
const FX_DRAW={
  clap(c,out){ // 一群人拍手：每個人是一串短促的雜音，左右散開，先變大再收尾
    const nb=fxNoise(c,0.2);
    for(let p=0;p<22;p++){
      const pan=c.createStereoPanner(); pan.pan.value=rnd(-0.9,0.9); pan.connect(out);
      const rate=rnd(3.5,5.5),f=rnd(1200,2800); let t=rnd(0,0.4);
      while(t<2.9){
        const src=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain(); src.buffer=nb; src.playbackRate.value=rnd(0.8,1.2);
        bp.type='bandpass'; bp.frequency.value=f*rnd(0.9,1.1); bp.Q.value=0.9;
        const env=Math.min(1,t/0.5)*Math.min(1,(3.1-t)/0.9);

// 每種特效先離線算好一段聲音，之後直接播；算完把每種調成差不多大聲（約 -18dB），峰值不超過 0.9 免得破音
const fxCache={};
const fxBuffer=name=>fxCache[name]||(fxCache[name]=(async()=>{
  const c=new OfflineAudioContext(2,Math.ceil(44100*FX_LEN[name]),44100),out=c.createGain(); out.connect(c.destination); FX_DRAW[name](c,out);
  const b=await c.startRendering(),ch=[b.getChannelData(0),b.getChannelData(1)]; let pk=0,sum=0;
  for(const d of ch) for(const v of d){ pk=Math.max(pk,Math.abs(v)); sum+=v*v; }
  const k=Math.min(0.126/Math.sqrt(sum/(2*b.length)||1),0.9/(pk||1)); for(const d of ch) for(let i=0;i<d.length;i++) d[i]*=k;
  return b;
})());
const fxWarm=()=>setTimeout(()=>FX.reduce((p,[k])=>p.then(()=>fxBuffer(k)),Promise.resolve()),1500);
async function fxPlay(ctx,name){ const b=await fxBuffer(name),src=ctx.createBufferSource(),g=ctx.createGain(); src.buffer=b; g.gain.value=0.9; src.connect(g); g.connect(ctx.destination); src.start(); }
// ---------- 特效畫面：彩帶、表情、星光畫在影片上的 canvas，標語用文字動畫 ----------
const FX_COLORS=['#ff4fa3','#33e1ff','#ffd166','#a855f7','#4ade80','#ff8a3d'];
function FxScene(layer){
  let cv=null,cx=null,parts=[],raf=0,W=0,H=0,last=0;
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  function fit(){
    if(!cv){ cv=document.createElement('canvas'); layer.appendChild(cv); cx=cv.getContext('2d'); }
    const r=layer.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1); W=r.width; H=r.height;
    if(cv.width!==Math.round(W*d)||cv.height!==Math.round(H*d)){ cv.width=Math.round(W*d); cv.height=Math.round(H*d); }

    if(p.kind==='rect'){ cx.scale(1,Math.cos(p.age*p.spin)); cx.fillStyle=p.color; cx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2); }
    else if(p.kind==='ribbon'){ cx.strokeStyle=p.color; cx.lineWidth=3; cx.beginPath(); for(let i=0;i<=12;i++){ const yy=i*p.size/12; cx.lineTo(Math.sin(i*0.9+p.age*12)*5,yy); } cx.stroke(); }
    else if(p.kind==='emoji'){ const sz=p.grow?p.size*(1+p.grow*Math.sin(Math.min(1,t*1.4)*Math.PI)):p.size; cx.font=sz+'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(p.text,0,0); }
    else if(p.kind==='spark'){ cx.fillStyle=p.color; cx.shadowColor=p.color; cx.shadowBlur=10; cx.beginPath(); const r=p.size*(1-t*0.5);
      for(let i=0;i<8;i++){ const a=i*Math.PI/4,rr=i%2?r*0.35:r; cx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr); } cx.closePath(); cx.fill(); }

      cx.beginPath(); cx.ellipse(0,0,z*0.55,z*0.22,0,0,Math.PI*2); cx.fill(); cx.stroke();                        // 身體
      cx.beginPath(); cx.arc(-z*0.55,-z*0.08,z*0.16,0,Math.PI*2); cx.fill();                                         // 頭
      cx.beginPath(); cx.moveTo(-z*0.68,-z*0.1); cx.lineTo(-z*0.92,-z*0.02); cx.lineTo(-z*0.68,0); cx.fill();       // 嘴
      cx.beginPath(); cx.moveTo(z*0.5,0); cx.lineTo(z*0.95,-z*0.18); cx.lineTo(z*0.95,z*0.14); cx.fill();            // 尾巴

      for(let i=0;i<34;i++){ const a=rnd(0,Math.PI*2),v=rnd(250,650)*u;
        add({kind:i%2?'spark':'emoji',text:pick(['✨','🌟','⭐']),color:pick(['#ffd166','#fff']),x:W/2,y:H*0.6,vx:Math.cos(a)*v,vy:Math.sin(a)*v,drag:0.955,g:120*u,size:i%2?rnd(7,12)*u:rnd(30,48)*u,vr:rnd(-4,4),life:rnd(1.4,2),wait:0.3+rnd(0,0.15)}); }

// 升降 Key（跟 KTV 機台常用的 SoundTouch 同一種做法）：
// 先把聲音切成約 40ms 一段重新排（升 Key 就拉長、降 Key 就縮短），每段接上去時在附近找「波形最像」的位置接，才不會嗡嗡、忽大忽小；
// 再用 ratio 倍速播放，長度變回原本、音高就變了
const PITCH_WORKLET=`class KtvPitch extends AudioWorkletProcessor{
  static get parameterDescriptors(){ return [{name:'ratio',defaultValue:1,minValue:0.5,maxValue:2,automationRate:'k-rate'}]; }
  constructor(){ super(); const sr=sampleRate; this.S=Math.round(sr*0.04); this.O=Math.round(sr*0.008); this.K=Math.round(sr*0.012); this.reset(); }
  reset(){ const M=1<<15; this.I=[new Float32Array(M),new Float32Array(M)]; this.T=[new Float32Array(M),new Float32Array(M)];
    this.tail=[new Float32Array(this.O),new Float32Array(this.O)]; this.iLen=this.tLen=this.pos=this.rp=0; this.first=true; this.run=false; }
  seek(lo,hi){ // 在 lo～hi 之間找開頭最像上一段結尾的位置（左右相加來比，左右用同一個接點，立體聲才不會散）
    const I=this.I,tl=this.tail,O=this.O; let best=-Infinity,bs=lo;
    const score=s=>{ let c=0,e=1e-9; for(let i=0;i<O;i+=2){ const m=I[0][s+i]+I[1][s+i]; c+=m*(tl[0][i]+tl[1][i]); e+=m*m; } return c/Math.sqrt(e); };
    for(let s=lo;s<=hi;s+=4){ const v=score(s); if(v>best){ best=v; bs=s; } }
    for(let s=Math.max(lo,bs-3),e=Math.min(hi,bs+3);s<=e;s++){ const v=score(s); if(v>best){ best=v; bs=s; } }
    return bs; }
  step(r){ // 接一段：開頭 O 跟上一段結尾交叉淡入、中間照抄、結尾 O 留給下一段
    const S=this.S,O=this.O,K=this.K,p=Math.round(this.pos);
    if(p+K+S>this.iLen||this.tLen+S>this.T[0].length) return false;
    const st=this.first?p:this.seek(Math.max(0,p-K),p+K); this.first=false;
    for(let c=0;c<2;c++){ const t=this.T[c],x=this.I[c],tl=this.tail[c]; let w=this.tLen;
      for(let i=0;i<O;i++){ const g=i/O; t[w++]=tl[i]*(1-g)+x[st+i]*g; }
      for(let i=O;i<S-O;i++) t[w++]=x[st+i];
      for(let i=0;i<O;i++) tl[i]=x[st+S-O+i]; }
    this.tLen+=S-O; this.pos+=(S-O)/r; return true; }
  process(ins,outs,params){
    const inp=ins[0],out=outs[0],r=params.ratio[0],n=out[0].length,I=this.I,T=this.T;
    if(this.iLen+n>I[0].length) this.reset();
    for(let c=0;c<2;c++){ const ch=inp&&inp.length?inp[Math.min(c,inp.length-1)]:null,b=I[c]; for(let k=0;k<n;k++) b[this.iLen+k]=ch?ch[k]:0; }
    this.iLen+=n;
    while(this.tLen-this.rp<n*r+this.S*2&&this.step(r));
    if(!this.run&&this.tLen-this.rp>=n*r+this.S) this.run=true;
    for(let k=0;k<n;k++){ let L=0,R=0;
      if(this.run){ const i=Math.floor(this.rp);
        if(i+1<this.tLen){ const f=this.rp-i; L=T[0][i]+(T[0][i+1]-T[0][i])*f; R=T[1][i]+(T[1][i+1]-T[1][i])*f; this.rp+=r; } else this.run=false; }
      out[0][k]=L; if(out[1]) out[1][k]=R; }
    // 用過的丟掉
    const ci=Math.round(this.pos)-this.K-8; if(ci>8192){ for(const b of I) b.copyWithin(0,ci,this.iLen); this.iLen-=ci; this.pos-=ci; }
    const ct=Math.floor(this.rp)-1; if(ct>8192){ for(const b of T) b.copyWithin(0,ct,this.tLen); this.tLen-=ct; this.rp-=ct; }
    return true;
  }
}
registerProcessor('ktv-pitch',KtvPitch);`;

const NOT_ORIG=/翻唱|翻自|cover|改編|改编|remix|\bdj\b|抖音|女聲版|男聲版|女声版|男声版|鋼琴|钢琴|吉他|piano|guitar|口琴|小提琴|二胡|古箏|古筝|八音盒|music\s*box|\b8d\b|慢速|加速|降速|\d\.\d+x|reaction|教學|教学|教你|live|現場|现场|演唱會|演唱会|直播|舞蹈|dance|片段|試聽|试听|\bcut\b|shorts|童聲|童声|\bai\b|我唱|歡唱|欢唱|包廂|唱得|小哥哥|小姐姐/i;
const KEY_SHIFT=/[男女]\s*key|[升降]\s*\d*\s*key|[男女]\s*[A-G]?[#b♭]?\s*[調调]|[+-]\d\s*key/i;

async function findKaraoke(title,singer){
  const names=String(singer||'').split(/[、．,，&＆\/]/).map(x=>x.trim()).filter(Boolean),q=(title+' '+(names[0]||'')).trim();
  const got=await Promise.all([q+' 伴奏',q+' KTV',q].map(x=>fetch(API+'/search?q='+encodeURIComponent(x)).then(r=>r.json()).catch(()=>[])));
  const seen=new Set(),all=[],put=got=>{ for(const j of got) if(Array.isArray(j)) for(const v of j) if(!seen.has(v.id)){ seen.add(v.id); all.push(v); } };
  put(got);
  const nt=normT(title),hasT=v=>!!nt&&normT(v.title).includes(nt);
  // 歌名很長時 YouTube 常常整串搜不到（像「若無你我欲去佗位」），改用歌手＋歌名前 4 個字再搜一次
  const short=[...title.replace(/\s+/g,'')].slice(0,4).join('');
  if(!all.some(hasT)&&short.length<[...title.replace(/\s+/g,'')].length){
    const q2=((names[0]||'')+' '+short).trim();
    put(await Promise.all([q2+' 伴奏',q2].map(x=>fetch(API+'/search?q='+encodeURIComponent(x)).then(r=>r.json()).catch(()=>[]))));
  }
  const keys=names.map(normT).filter(Boolean);
  const bySinger=v=>!keys.length||keys.some(k=>normT(v.title).includes(k)||normT(v.ch).includes(k));
  const fine=v=>hasT(v)&&!NOT_ORIG.test(v.title);
  // 原曲（原唱歌手、不是伴唱）：長度當標準，伴唱版長度差太多就是別的編曲
  const origs=all.filter(v=>fine(v)&&bySinger(v)&&!KARAOKE.test(v.title)&&!/ktv|導唱|导唱/i.test(v.title));
  // 標準優先用官方音軌（「- Topic」頻道）或歌詞版，MV 常有較長的開頭結尾
  const refRank=v=>/- topic$/i.test(v.ch)?3:/歌詞|歌词|lyrics?/i.test(v.title)?2:1;
  const refS=secsOf(origs.filter(v=>secsOf(v)>60).sort((a,b)=>refRank(b)-refRank(a))[0]||{});
  const near=v=>{ const d=secsOf(v); return refS&&d?Math.abs(d-refS):999; };
  const kar=all.filter(v=>fine(v)&&(isKaraoke(v)||maybeKaraoke(v))&&bySinger(v)); // 歌手對不上的伴唱多半是翻唱版或同名的別首歌
  const score=v=>(isKaraoke(v)?3:1)+(bySinger(v)?4:0)+(near(v)<=15?2:near(v)<=40||near(v)===999?0:-2)+kBonus(v);
  const best=kar.sort((a,b)=>score(b)-score(a))[0];
  if(best&&score(best)>=4) return {sg:song(best),karaoke:true};
  // 沒有伴唱版：放原曲，歌詞版、MV 優先
  const lyr=v=>/歌詞|歌词|lyrics?|動態|动态|官方|official|\bmv\b/i.test(v.title)?1:0;
  const orig=origs.slice().sort((a,b)=>lyr(b)-lyr(a))[0];
  return orig?{sg:song(orig),karaoke:false}:null;
}

const KARAOKE=/伴唱|伴奏|karaoke|卡拉\s*ok|消音|去人聲|無人聲|純音樂|instrumental|off\s*vocal|backing\s*track|左伴右唱|右伴左唱/i;

async function doSearch(text,many){ // many：快捷鍵指定的好幾組搜尋字，結果交錯排
  text=String(text||'').trim(); if(!text) return;
  tab='search';
  if(!backPushed){ try{ history.pushState({ktvSearch:1},''); backPushed=true; }catch(e){} }
  const id=ytId(text);
  if(id){ // 貼上網址：直接查這支影片
    results=[{id,title:'讀取中…'}]; renderList();
    try{ const r=await fetch(API+'/info?id='+id); const j=await r.json(); results=[song({id,title:j.title||'YouTube 影片',ch:j.ch})]; }
    catch(e){ results=[song({id})]; }
    renderList(); return;
  }
  // 勾選伴唱版時同時找「歌名 伴奏」和「歌名 KTV 伴唱」，合併後只留標題看得出是伴唱的
  const kOnly=$('#kOnly').checked,has=/ktv|伴唱|伴奏|karaoke|卡拉/i.test(text);
  const qs=many||(kOnly&&!has?[text+' 伴奏',text+' KTV 伴唱',text+' KTV']:[text]);
  searching=true; results=null; hidden=0; maybeAt=-1; renderList();
  const got=await Promise.all(qs.map(q=>fetch(API+'/search?q='+encodeURIComponent(q)).then(r=>r.json()).catch(()=>null)));
  if(got.every(j=>!Array.isArray(j))) toast('搜尋失敗，請確認網路後再試一次');
  const seen=new Set(),all=[],lists=got.map(j=>Array.isArray(j)?j:[]),push=v=>{ if(v&&!seen.has(v.id)){ seen.add(v.id); all.push(v); } };
  if(many){ for(let k=0;k<Math.max(...lists.map(l=>l.length));k++) for(const l of lists) push(l[k]); } else for(const l of lists) l.forEach(push);
  const mins=l=>{ const p=String(l||'').split(':').map(Number); return p.length>=3?p[0]*60+p[1]:p.length===2?p[0]:0; };
  const total=all.length;
  if(kOnly){
    const ok=all.filter(v=>mins(v.len)<10); // 10 分鐘以上的串燒、合輯唱不了，算進隱藏
    const sure=ok.filter(isKaraoke),maybe=ok.filter(maybeKaraoke); results=sure.concat(maybe); maybeAt=maybe.length?sure.length:-1;
  } else results=all;
  hidden=total-results.length;
  searching=false; renderList();
}

  const room=JOIN; let S={now:null,q:[],paused:false},got=false,moved=false;
  $('#app').innerHTML='<header><span class="logo">🎤 點歌</span><span class="small"><span class="dot" id="net"></span>房號 '+room+'</span><span class="sp"></span>'+
    '<input class="name" id="nm" placeholder="你的名字" maxlength="10"></header>'+
    '<div id="remote"><div class="now"><div id="rStage"><div id="rPlayer"></div><div id="rShield"></div><div id="rMsg"></div></div>'+
      '<div class="small">正在唱<button class="link" id="bWatch"></button></div><div class="t" id="nowT">連線中…</div>'+
      '<div class="ctl"><button id="bPause">⏸ 暫停</button><button id="bReplay">↺ 重唱</button><button class="main" id="bSkip">⏭ 切歌</button></div>'+
      '<div class="fxGrid" id="fxGrid">'+fxButtons()+'</div></div>'+
      searchHTML()+'</div><div id="toast" style="position:fixed"></div>';
  const nm=$('#nm'); nm.value=load('ktv.name','');
  nm.onchange=()=>save('ktv.name',clean(nm.value));
  const pub=c=>{ if(moved){ toast('房號已經停用，請重新掃描 QR Code'); return false; } if(!mq||!mq.up){ toast('還沒連上主機，請稍等'); return false; } mq.pub(TOPIC+room+'/c',c); return true; };
  UI.state=()=>S; UI.hist=()=>S.hist||[]; UI.lib=()=>S.lib||[]; UI.lists=()=>S.lists||[];
  UI.act=c=>{ c.by=clean(nm.value); if(!pub(c)) return;
    if(c.t==='add') toast(c.top?'已插播：'+c.s.title:'已點歌：'+c.s.title);
    else if(c.t==='plAdd') toast('已加入歌單：'+c.s.title);
    else if(c.t==='plNew') toast('新增了歌單「'+c.name+'」');
    else if(c.t==='plAll') toast('整個歌單都點好了'); };
  bindSearch();
  $('#bPause').onclick=()=>pub({t:'pause'});
  $('#bReplay').onclick=()=>pub({t:'replay'});
  $('#bSkip').onclick=()=>pub({t:'skip'});
  $('#fxGrid').onclick=e=>{ const b=e.target.closest('button'); if(b&&pub({t:'fx',n:b.dataset.fx,by:clean(nm.value)})) fxFlash(b); };
  // 手機上的畫面：靜音播跟電視同一支影片，照電視每幾秒送來的秒數對齊（聲音只從電視出來）
  let watch=load('ktv.watch',true),yp=null,yReady=false,T=null,tAt=0,seekAt=0;
  function vidMsg(){
    if(!watch) return '';
    if(moved||!S.now) return got?'還沒開始唱，點一首吧！':'連線中…';
    if(isLocal(S.now)||(T&&T.k===(S.now.k||S.now.id)&&T.local)) return '電視正在放電腦裡的歌，畫面只在電視上';
    if(!T||T.k!==(S.now.k||S.now.id)) return '畫面準備中…';
    return '';
  }
  function syncVid(){
    $('#rStage').style.display=watch?'':'none';
    $('#bWatch').textContent=watch?'隱藏畫面':'📺 顯示畫面';
    const m=vidMsg(); $('#rMsg').textContent=m;
    if(!watch){ if(yReady) yp.stopVideo(); return; }
    if(!yp){ if(!m) loadYT(); return; } // 真的有影片要放才載 YouTube，不跟連線搶網路
    if(!yReady) return;
    if(!yp.isMuted()) yp.mute(); // 聲音和音量只歸電視那台管
    if(m){ if(yp.getPlayerState()===1) yp.pauseVideo(); return; }
    const target=T.t+(T.p?0:(Date.now()-tAt)/1000),st=yp.getPlayerState();
    if((yp.getVideoData()||{}).video_id!==T.id){ yp.loadVideoById({videoId:T.id,startSeconds:target+1}); seekAt=Date.now(); return; } // 多 1 秒給它載入
    if(T.p){ if(st===1||st===3) yp.pauseVideo(); if(Math.abs(yp.getCurrentTime()-target)>1) yp.seekTo(target,true); return; }
    if(st!==1&&st!==3) yp.playVideo();
    if(st===1&&Date.now()-seekAt>4000&&Math.abs(yp.getCurrentTime()-target)>1.2){ yp.seekTo(target+0.4,true); seekAt=Date.now(); }
  }
  function loadYT(){
    yp=1;
    window.onYouTubeIframeAPIReady=()=>{
      yp=new YT.Player('rPlayer',{width:'100%',height:'100%',playerVars:{autoplay:1,mute:1,controls:0,disablekb:1,rel:0,playsinline:1,modestbranding:1,fs:0,iv_load_policy:3},
        events:{onReady:()=>{ yp.mute(); yReady=true; syncVid(); }}});
    };
    const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s);
  }
  $('#bWatch').onclick=()=>{ watch=!watch; save('ktv.watch',watch); syncVid(); };
  $('#rShield').onclick=()=>{ if(yReady&&!vidMsg()&&T&&!T.p) yp.playVideo(); }; // 擋住影片本身的點擊，不讓手機自己暫停
  setInterval(syncVid,1000);
  function draw(){
    syncVid();
    $('#nowT').textContent=moved?'這個房號已經停用，請重新掃描電視上的 QR Code':S.now?S.now.title:(got?'目前沒有播放，點一首吧！':'連不到電視，請確認電視畫面已打開、房號正確');
    $('#bPause').textContent=S.paused?'▶ 繼續':'⏸ 暫停';
    renderList();
  }
  const mq=Mq(MQ_URL,()=>{ mq.sub(TOPIC+room+'/s'); mq.sub(TOPIC+room+'/t'); mq.pub(TOPIC+room+'/c',{t:'hi'}); setTimeout(()=>{ if(!got) draw(); },5000); },
    o=>{ if(o&&o.k&&!o.q){ T=o; tAt=Date.now(); syncVid(); return; }
      if(o&&o.moved){ moved=true; mq.close(); S={now:null,q:[],paused:false}; draw(); toast('電視換了新的房號，請重新掃描 QR Code'); return; }
      if(!o||!Array.isArray(o.q)) return; got=true; S={now:o.now||null,q:o.q,paused:!!o.paused,hist:Array.isArray(o.hist)?o.hist:[],lib:Array.isArray(o.lib)?o.lib:[],lists:Array.isArray(o.lists)?o.lists:[]}; VR_IDS=new Set(Array.isArray(o.vr)?o.vr:[]); draw(); },
    up=>{ const d=$('#net'); if(d) d.classList.toggle('on',up); });
  draw(); $('#nowT').textContent='連線中…';
  window.__ktv={S:()=>S,mq};
}

// ---------- 去人聲處理（小視窗處理 YouTube、電視頁處理電腦裡的歌，共用這一套）----------
// 原理跟 KTV 機台的消音一樣：人聲多半在左右聲道正中間，左減右就把它扣掉；
// 扣掉時低音、鼓和鈸也會一起變小，所以中間聲道只扣人聲集中的頻段（約 180Hz～6kHz），其他補回來，再自動把音量拉回原音大小
// 例外：有些 KTV 影片左右聲道分開（一邊伴唱、一邊原唱），左減右反而會把人聲挑出來，這種就只放伴唱那一邊
// 「單聲道」「左右分開」是整首歌的性質，只在每首開頭有聲音的前 30／60 秒判斷，之後鎖定——
// 不然唱到一半遇到左右差不多的段落、或某一邊樂器特別大聲，會被誤判而跑回原唱
const VR_TUNE={mono:120,learn:240}; // 單位：0.25 秒
function VocalRemover(ctx,src,onChange){
  let on=false,mono=false,dual=null,dualLock=false,dualN=0,normN=0,quiet=0,loud=0,boost=1,eL=0,eR=0,eS=0,level=0,ratio=0,heard=0;
  const tell=ev=>{ if(onChange) onChange(ev); };
  const g=v=>{ const n=ctx.createGain(); n.gain.value=v; return n; };
  const sp=ctx.createChannelSplitter(2); src.connect(sp);
  const side=g(1),mid=g(1); side.channelCount=1; side.channelCountMode='explicit'; mid.channelCount=1; mid.channelCountMode='explicit';
  const lP=g(1),rN=g(-1),lH=g(0.5),rH=g(0.5);
  sp.connect(lP,0); sp.connect(rN,1); lP.connect(side); rN.connect(side);
  sp.connect(lH,0); sp.connect(rH,1); lH.connect(mid); rH.connect(mid);
  const filt=(type,hz)=>{ const a=ctx.createBiquadFilter(),b=ctx.createBiquadFilter(); a.type=b.type=type; a.frequency.value=b.frequency.value=hz; a.connect(b); return [a,b]; };
  const [lp1,lp2]=filt('lowpass',180),[hp1,hp2]=filt('highpass',6000),bass=g(1.5),treble=g(1.2),proc=g(1);
  mid.connect(lp1); lp2.connect(bass); mid.connect(hp1); hp2.connect(treble);
  // sideAmp：自動把兩側的樂器放大（最多 4 倍），補回跟著人聲一起被扣掉的音量；限幅器避免爆音
  const sideAmp=g(1),lim=ctx.createDynamicsCompressor();
  side.connect(sideAmp); sideAmp.connect(proc); bass.connect(proc); treble.connect(proc);
  lim.threshold.value=-3; lim.knee.value=0; lim.ratio.value=20; lim.attack.value=0.003; lim.release.value=0.2;
  const procGate=g(1),pL=g(0),pR=g(0); proc.connect(procGate); procGate.connect(lim);
  lP.connect(pL); rH.connect(pR); pL.connect(lim); pR.connect(lim); // rH 是右聲道的一半，選右邊時給 2 倍
  const pick=()=>{ const t=ctx.currentTime; procGate.gain.setTargetAtTime(dual?0:1,t,0.05); pL.gain.setTargetAtTime(dual==='L'?1:0,t,0.05); pR.gain.setTargetAtTime(dual==='R'?2:0,t,0.05); };
  const wet=g(0),dry=g(1),out=g(1); lim.connect(wet); src.connect(dry); wet.connect(out); dry.connect(out);
  const apply=()=>{ const useWet=on&&!mono,t=ctx.currentTime; wet.gain.setTargetAtTime(useWet?1:0,t,0.05); dry.gain.setTargetAtTime(useWet?0:1,t,0.05); };
  // 量中間（人聲）和兩側的音量：兩側幾乎沒聲音就是單聲道，消不掉
  const an=node=>{ const a=ctx.createAnalyser(); a.fftSize=2048; node.connect(a); return a; };
  const above200=node=>{ const h=ctx.createBiquadFilter(); h.type='highpass'; h.frequency.value=200; node.connect(h); return h; };
  const aS=an(side),aM=an(mid),aMh=an(above200(mid)),aSh=an(above200(side)),aPh=an(above200(proc)),aL=an(lP),aR=an(rH);
  const buf=new Float32Array(2048),rms=a=>{ a.getFloatTimeDomainData(buf); let x=0; for(const v of buf) x+=v*v; return Math.sqrt(x/buf.length); };
  const timer=setInterval(()=>{
    const sv=rms(aS),mv=rms(aM); level=mv;
    // 只比 200Hz 以上：原音＝√(中間² + 兩側²)（side 是左減右＝兩側的兩倍）；人聲拿掉了，目標抓原音的七成
    const orig=Math.sqrt(rms(aMh)**2+rms(aSh)**2/4),now=rms(aPh)/boost;
    if(orig>0.01&&now>0.0005){ boost+=(Math.min(4,Math.max(1,orig*0.7/now))-boost)*0.3; sideAmp.gain.setTargetAtTime(boost,ctx.currentTime,0.3); }
    if(mv<0.01) return; // 沒聲音（換歌、廣告空檔）時不判斷
    heard++;
    if(sv/mv<0.04){ loud=0; if(++quiet===6&&!mono&&heard<=VR_TUNE.mono){ mono=true; apply(); tell('mono'); } }
    else { quiet=0; if(++loud===3&&mono){ mono=false; apply(); tell('state'); } }
    // 左右分開的判斷：原唱那邊＝伴唱＋人聲，所以「兩邊能量差」幾乎等於「左減右的能量」；一般歌左右差不多大，差很小
    const k=0.15,l=rms(aL),r=rms(aR)*2; eL+=(l*l-eL)*k; eR+=(r*r-eR)*k; eS+=(sv*sv-eS)*k;
    ratio=eS>1e-6?Math.abs(eR-eL)/eS:0;
    if(!dualLock&&heard<=VR_TUNE.learn){
      if(ratio>0.85){ normN=0; if(++dualN===20){ const d=eR>eL?'L':'R'; if(d!==dual){ dual=d; pick(); tell('dual'); } } }
      else if(ratio<0.3&&sv/mv>0.1){ dualN=0; if(++normN===12&&dual){ dual=null; pick(); tell('state'); } }
    }
  },250);
  return {
    out,nodes:{wet,dry,lim,procGate,pL,pR,sideAmp,out},
    get on(){ return on; },get mono(){ return mono; },get dual(){ return dual; },get level(){ return level; },get boost(){ return boost; },get ratio(){ return ratio; },get heard(){ return heard; },
    setOn(v){ on=!!v; apply(); },
    flip(){ if(!dual) return; dual=dual==='L'?'R':'L'; dualLock=true; pick(); tell('state'); }, // 自動判斷猜錯時換另一邊
    normal(){ dual=null; dualLock=true; pick(); tell('state'); },                             // 或改回一般去人聲（這首不再自動判斷）
    reset(){ dualLock=false; dual=null; mono=false; dualN=normN=quiet=loud=heard=0; pick(); apply(); },                       // 換歌時重新判斷
    close(){ clearInterval(timer); },
  };
}

// ---------- 去人聲小視窗（處理 YouTube）----------
function startVR(){
  document.title='去人聲 - 隨時唱 KTV'; fxWarm();
  const bc=new BroadcastChannel('ktv-vr');
  let ctx=null,stream=null,vr=null,on=false,meter=0,pitch=null,key=0;
  $('#app').innerHTML='<header><span class="logo">🎤 去人聲</span></header><div id="vr">'+
    '<div id="vrIntro"><p class="small" style="margin:0 0 6px">在唱歌畫面按「🎤 去人聲」→ 按「分享」就會自動接上。也可以在這裡手動開始：</p><ol><li>按下面的「開始」</li><li>在跳出的視窗選「<b>分頁</b>」→ 點「<b>隨時唱 KTV</b>」</li><li>確認有勾「<b>同時分享分頁音訊</b>」→ 按「<b>分享</b>」</li></ol></div>'+
    '<button class="main big" id="vrGo">開始</button>'+
    '<div class="st" id="vrSt">還沒開始</div>'+
    '<div class="small">音量</div><div class="meter"><i id="vrM"></i></div>'+
    '<button class="big" id="vrTog" disabled>去人聲：關</button>'+
    '<div class="st" id="vrKey" style="display:none"></div>'+
    '<div class="row" id="vrFix" style="display:none;gap:8px"><button id="vrFlip" style="flex:1">換另一邊</button><button id="vrNorm" style="flex:1">改回一般去人聲</button></div>'+
    '<div class="small">這個視窗要一直開著（可以縮小），關掉就恢復原音。每首歌一開始都是原音，要去人聲再按上面的按鈕；人聲會變小但不一定完全消失。</div></div>';
  const say=fresh=>bc.postMessage({t:'state',live:!!stream,on,key,fresh:!!fresh,v:APP_V});
  function setPitch(k){ // 原調時繞過變調，不影響音質
    key=Math.max(-6,Math.min(6,k|0));
    if(vr){ vr.out.disconnect(); vr.out.connect(key&&pitch?pitch:ctx.destination); }
    if(pitch) pitch.parameters.get('ratio').value=Math.pow(2,key/12);
    $('#vrKey').style.display=key&&stream?'':'none'; $('#vrKey').textContent='🎵 Key '+(key>0?'+':'')+key;
  }
  function mix(fresh){ // 依開關更新處理和畫面；fresh＝剛開始
    if(!ctx||!vr) return; vr.setOn(on);
    const mono=vr.mono,dual=vr.dual;
    $('#vrTog').textContent='去人聲：'+(on?'開':'關');
    $('#vrSt').textContent=!stream?'還沒開始':mono&&on?'這首是單聲道，人聲消不掉，暫時放原音':on&&dual?'✅ 這首是左右聲道分開的 KTV 影片，只放伴唱那一邊（'+(dual==='L'?'左':'右')+'）':on?'✅ 去人聲中':'原音播放中（要去人聲請按下面的按鈕）';
    $('#vrFix').style.display=stream&&on&&dual?'flex':'none';
    say(fresh);
  }
  function stop(){
    if(!stream&&!ctx) return;
    clearInterval(meter); if(vr) vr.close(); vr=null;
    if(stream) stream.getTracks().forEach(t=>t.stop()); stream=null;
    if(ctx){ ctx.close(); ctx=null; } pitch=null; key=0; $('#vrKey').style.display='none';
    $('#vrGo').disabled=false; $('#vrGo').textContent='開始'; $('#vrTog').disabled=true; $('#vrIntro').style.display=''; $('#vrSt').textContent='還沒開始'; say();
  }
  // 手動開始（舊做法，自己選分頁）
  $('#vrGo').onclick=async()=>{
    if(ctx&&ctx.state!=='running'){ await ctx.resume(); vrReady(); return; } // 瀏覽器要求先點一下才能出聲
    let st;
    try{
      st=await navigator.mediaDevices.getDisplayMedia({video:{displaySurface:'browser'},
        audio:{suppressLocalAudioPlayback:true,echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:2},
        selfBrowserSurface:'exclude',systemAudio:'exclude',surfaceSwitching:'exclude',preferCurrentTab:false});
    }catch(e){ $('#vrSt').textContent='沒有開始（取消了或瀏覽器不支援），可以再按一次「開始」'; return; }
    st.getVideoTracks().forEach(t=>t.stop());
    if(!st.getAudioTracks().length){ st.getTracks().forEach(t=>t.stop()); $('#vrSt').textContent='沒有分享到聲音：請再按一次，記得勾「同時分享分頁音訊」'; return; }
    begin(st);
  };
  // 電視頁分享好聲音後直接交過來
  window.__vrAttach=(st,o)=>{ if(stream) stop(); on=!!(o&&o.on); begin(st,o&&o.key); }; // 從唱歌畫面按「去人聲」來的＝這首馬上開
  function vrReady(){ // 聲音真的開始處理了才算啟動
    if(!ctx||ctx.state!=='running'){ $('#vrGo').disabled=false; $('#vrGo').textContent='▶ 按這裡開始（瀏覽器要求先點一下）'; $('#vrSt').textContent='已接上唱歌畫面，按上面的按鈕就開始'; return false; }
    $('#vrGo').disabled=true; $('#vrGo').textContent='進行中'; $('#vrTog').disabled=false; $('#vrIntro').style.display='none';
    mix(true); return true;
  }
  async function begin(st,k0){
    stream=st; const at=stream.getAudioTracks()[0];
    at.addEventListener('ended',stop);
    ctx=new AudioContext({latencyHint:'interactive'});
    const src=ctx.createMediaStreamSource(new MediaStream([at]));
    vr=VocalRemover(ctx,src,ev=>{ if(ev==='mono'&&on) bc.postMessage({t:'mono'}); mix(); });
    vr.out.connect(ctx.destination);
    try{ await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([PITCH_WORKLET],{type:'text/javascript'}))); pitch=new AudioWorkletNode(ctx,'ktv-pitch',{outputChannelCount:[2]}); pitch.connect(ctx.destination); }catch(e){ pitch=null; }
    if(!ctx) return; // 等的時候被關掉了
    setPitch(k0||0);
    window.__vrNodes=Object.assign({ctx,src,pitch},vr.nodes);
    meter=setInterval(()=>{ if(vr) $('#vrM').style.width=Math.min(100,vr.level*300)+'%'; },250);
    if(ctx.state!=='running') await Promise.race([ctx.resume(),new Promise(r=>setTimeout(r,400))]);
    if(!vrReady()) bc.postMessage({t:'needClick'});
  }
  $('#vrTog').onclick=()=>{ on=!on; mix(); bc.postMessage({t:'user',on}); };
  $('#vrFlip').onclick=()=>{ if(vr) vr.flip(); };
  $('#vrNorm').onclick=()=>{ if(vr) vr.normal(); };
  // 換歌（電視送 set）時重新判斷左右聲道
  bc.onmessage=e=>{ const m=e.data||{}; if(m.t==='fx'&&ctx){ fxPlay(ctx,m.n); return; } if(m.t==='set'&&stream){ on=!!m.on; if(vr) vr.reset(); if('key' in m) setPitch(m.key); mix(); } else if(m.t==='key'&&stream) setPitch(m.k); else if(m.t==='ask') say(); };
  addEventListener('pagehide',()=>{ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; say(); } });
  window.__vr={mix,get on(){ return on; },get mono(){ return vr&&vr.mono; },get dual(){ return vr&&vr.dual; },get ratio(){ return vr?vr.ratio:0; },get boost(){ return vr?vr.boost:1; },get key(){ return key; }};
}

if(IS_VR) startVR(); else if(IS_REMOTE) startRemote(); else startTV();
</script>
